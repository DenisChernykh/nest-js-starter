name: Stage image

on:
  push:
    branches: [stage]

permissions:
  contents: read

concurrency:
  group: stage-image-${{ github.ref }}
  queue: max

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: false
      - name: Setup Docker Compose
        uses: docker/setup-compose-action@4eb059ff7f16592f9c84d5ca339c53cb7c5064e2 # v2.3.0
        with:
          version: v2.39.4
      - run: corepack pnpm@11.15.1 install --frozen-lockfile
      - name: Run full gate
        run: corepack pnpm@11.15.1 run check
        env:
          TESTCONTAINERS_REUSE_ENABLE: 'false'

  publish:
    needs: gate
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          check-latest: false
      - run: corepack pnpm@11.15.1 install --frozen-lockfile
      - id: image
        name: Derive public image metadata
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}" >> "${GITHUB_OUTPUT}"
          echo "created=$(git show -s --format=%cI "${GITHUB_SHA}")" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_SOURCE=${{ github.server_url }}/${{ github.repository }}
            BUILD_CREATED=${{ steps.image.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan immutable digest
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1
      - name: Pull published image for smoke
        run: docker pull "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}"
      - name: Smoke published image
        run: corepack pnpm@11.15.1 exec tsx scripts/oci/run-image-smoke.ts -- --image "${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}" --revision "${{ github.sha }}"
      - name: Print immutable digest
        run: echo "digest=${{ steps.build.outputs.digest }}"
