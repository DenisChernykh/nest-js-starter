x-development-image: &development-image
  image: nest-js-starter:development
  build:
    context: .
    target: development

x-api-environment: &api-environment
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-nest-js-starter}
  SERVICE_VERSION: ${SERVICE_VERSION:-0.1.0-alpha.0}
  SERVICE_REVISION: ${SERVICE_REVISION:-local}
  OTEL_SDK_DISABLED: 'false'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://alloy:4318
  API_HOST: 0.0.0.0
  API_PORT: 3000
  API_DOCS_MODE: ${API_DOCS_MODE:-public}
  PUBLIC_API_URL: ${PUBLIC_API_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS}
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
  REDIS_COORDINATION_URL: redis://default:local-development-only@redis-coordination:6379
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-nest-js-starter}
  AUTH_SESSION_KEY_SECRET: ${AUTH_SESSION_KEY_SECRET}
  AUTH_CSRF_SECRET: ${AUTH_CSRF_SECRET}
  AUTH_RATE_LIMIT_KEY_SECRET: ${AUTH_RATE_LIMIT_KEY_SECRET}
  AUTH_NETWORK_METADATA_SECRET: ${AUTH_NETWORK_METADATA_SECRET}

services:
  postgres:
    image: postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis-coordination:
    image: redis:8.8.0-trixie@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - local-development-only
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    volumes:
      - redis-coordination-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=local-development-only redis-cli ping | grep PONG
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrator:
    <<: *development-image
    command: ['corepack', 'pnpm@11.15.1', 'run', 'start:migrate']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *development-image
    profiles:
      - development
    environment: *api-environment
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis-coordination:
        condition: service_healthy
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          initial_sync: true
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./pnpm-workspace.yaml
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./prisma.config.ts
        - action: sync+restart
          path: ./nest-cli.json
          target: /app/nest-cli.json
        - action: sync+restart
          path: ./tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ./tsconfig.build.json
          target: /app/tsconfig.build.json
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /app/tsconfig.base.json

volumes:
  postgres-data:
  redis-coordination-data:
