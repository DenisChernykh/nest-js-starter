services:
  postgres:
    image: postgres:18.4-trixie@sha256:3a82e1f56c8f0f5616a11103ac3d47e632c3938698946a7ad26da0df1334744a
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:${POSTGRES_PORT}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis-coordination:
    image: redis:8.8.0-trixie@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - always
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - local-development-only
    ports:
      - '127.0.0.1:${REDIS_PORT}:6379'
    volumes:
      - redis-coordination-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH=local-development-only redis-cli ping | grep PONG
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
  redis-coordination-data:
